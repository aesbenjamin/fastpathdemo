[project]
name = "fastpath-music-server"
version = "0.1.0"
description = "Backend local da demo FastPath Music: FastPath no Aura Graph Analytics + IA generativa"
requires-python = ">=3.11,<3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "neo4j>=5.27",
    "graphdatascience>=1.15",
    "numpy>=1.26",
    "scikit-learn>=1.5",
    "openai>=1.50",
    "python-dotenv>=1.0",
]

[tool.uv]
package = false
